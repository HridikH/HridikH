name: refresh

# Regenerates the live SVGs (stats card + contribution snake) and commits them,
# so the README never depends on a third-party image service at view time.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/refresh.yml"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stats card
        env:
          # Add a STATS_TOKEN secret (classic PAT, read:user) to include private contributions.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/stats.py

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/live/snake-light.svg?color_snake=#B26D12&color_dots=#EDE8DD,#F1DDBB,#E2B56E,#C98A2E,#8F5A14
            assets/live/snake-dark.svg?color_snake=#E8A33D&color_dots=#161C23,#3A2E1C,#6B4E22,#A8742C,#E8A33D

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/live
          if ! git diff --cached --quiet; then
            git commit -m "Refresh live stats"
            git push
          fi
